<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Výber dátumu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#E2BD7A}a:hover{color:#ECE6D8}</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 32px; background: #12141F; color: #ECE6D8; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px">
    <button aria-label="Predchádzajúci mesiac" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #ECE6D8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <h1 style="margin: 0; font: 500 24px/30px Literata, serif">November 2026</h1>
    <button aria-label="Nasledujúci mesiac" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #ECE6D8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 15px">
    <sc-for list="{{ heads }}" as="h" hint-placeholder-count="7"><div style="height: 28px; font-size: 12px; color: #A9A595">{{ h }}</div></sc-for>
    <sc-for list="{{ days }}" as="d" hint-placeholder-count="30">
      <div style="height: 50px; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{ d.show }}" hint-placeholder-val="{{ true }}">
          <button aria-label="{{ d.label }}" style="{{ d.style }}">{{ d.n }}<span style="{{ d.dot }}"></span></button>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A9A595"><span style="width: 6px; height: 6px; border-radius: 3px; background: #E2BD7A"></span>V tento deň už je zapísaný sen</p>
  <div style="flex-grow: 1"></div>
  <a href="Zapis.dc.html" style="height: 52px; border-radius: 12px; background: #E2BD7A; color: #1B1608; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Vybrať 7. novembra</a>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dreamDays = [1, 3, 5, 7];
    const days = [];
    for (let i = 0; i < 6; i++) days.push({ show: false });
    for (let n = 1; n <= 30; n++) {
      const sel = n === 7;
      const has = dreamDays.includes(n);
      days.push({
        show: true,
        n,
        label: n + '. november' + (has ? ', sen zapísaný' : ''),
        style: 'position: relative; width: 46px; height: 46px; border: 0; border-radius: 23px; font: ' + (sel ? '600' : '400') + ' 15px "DM Sans", sans-serif; color: ' + (sel ? '#1B1608' : '#ECE6D8') + '; background: ' + (sel ? '#E2BD7A' : 'transparent'),
        dot: has ? 'position: absolute; left: 20px; bottom: 6px; width: 6px; height: 6px; border-radius: 3px; background: ' + (sel ? '#1B1608' : '#E2BD7A') : 'display: none'
      });
    }
    return { heads: ['Po', 'Ut', 'St', 'Št', 'Pi', 'So', 'Ne'], days };
  }
}
</script>
</body>
</html>
